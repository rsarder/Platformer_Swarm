  expected_output: >
    Boot scene logic completed and saved in scenes-boot.js.

html5_game_systems_implementation:
  <<: *task_common
  agent: html5_game_engineer
  description: |
    You are responsible for implementing the **game systems** in the file `systems.js`. This includes all logic that falls under global systems, UI systems, and input control systems.

    **Setup:**
    - Use the `read_file` tool to open and analyze the `task-game-systems.md` file.
    - Identify all system-level responsibilities, including UI interactions, input handling, audio playback, and game state control.

    **Core Task:**
    - Implement all **game systems** identified in the task file. Systems include (but are not limited to):
      - Input control systems that manage key mappings and player input.
      - UI/HUD systems such as score displays, health indicators, level transitions.
      - Game state and flow control (e.g. pause/resume, transitions).
      - Audio integration, including sound effect and music triggers.
    - Ensure modularity and clarity—separate concerns logically inside the file.

    **Final Step:**
    - Save the completed file as `systems.js` using the `write_file` tool.
  expected_output: >
    All global game systems have been implemented and saved in systems.js.

html5_game_mechanics_implementation:
  <<: *task_common
  agent: html5_game_engineer
  description: |
    You are responsible for implementing the **complete game mechanics** in the file `mechanics.js`, based on the design outlined in `task-game-mechanics.md`.

    **Setup:**
    - Use the `read_file` tool to open and analyze the `task-game-mechanics.md` file.
    - Extract all described game mechanics, including implementation details, parameters, subcomponents, and any provided pseudocode or formulas.

    **Core Task:**
    - Implement all **gameplay logic** fully in JavaScript with no placeholder code, no pseudocode, and no incomplete functions.
    - Mechanics to include (as applicable):
      - Character movement, jumping, attacking, or shooting.
      - Scoring system, game progression, and level transitions.
      - Collision detection and handling for environment, enemies, and items.
      - Resource collection (e.g., health packs, power-ups), buffs, and temporary effects.
      - Player state systems: health, lives, respawn, game over, and win conditions.
    - Ensure all code is functional, organized, and callable from the main game loop or relevant systems.

    **Requirements:**
    - All logic must be written in valid JavaScript, structured for integration with an HTML5 game engine.
    - No placeholders, no TODOs, no pseudocode — final code must be ready for direct execution and testing.
    - Organize code using reusable functions and clearly separated modules for each mechanic, where applicable.

    **Final Step:**
    - Save the fully implemented file as `mechanics.js` using the `write_file` tool.
  expected_output: >
    All core game mechanics have been fully implemented in JavaScript with no pseudocode or placeholders and saved as mechanics.js.

