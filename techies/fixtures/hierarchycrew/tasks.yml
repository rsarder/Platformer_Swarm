_task_common: &task_common
  human_input: false
  async_execution: false

game_hierarchy_extraction:
  <<: *task_common
  agent: hierarchy_extractor
  description: >
    Your task is to analyze the provided game description and extract the high-level game structure and flow.
    Follow these guidelines:
      - Create a metadata section at the top with the game's name and a summary of its core mechanics, logic, UI, and features.
      - Identify all levels or stages, transitions between them, and clearly state all win and lose conditions.
      - Outline major components such as main menus and other screens (options, shop, transition, loading, etc.), level progression, and key game events, as well as the overall narrative.
      - Do not focus on nested subcomponents; focus solely on the outer structure.
      - Ensure that no markdown formatting or any lines containing "Action:" appear in your output.
      - Output the final YAML snippet directly without writing to a file.
  expected_output: >
    A YAML snippet containing a "GameFlow" that outlines the outer structure: levels, transitions, win/lose conditions, and key game events, presented in a clear, modular format.

mechanics_ai_extraction:
  <<: *task_common
  agent: mechanics_ai_specialist
  description: >
    Your task is to extract and detail the core gameplay mechanics, physics parameters, and enemy AI behaviors from the game description.
    Follow these guidelines:
      - Document player movement, including (if relevant to the game) jump physics, and any other physical parameters.
      - List player abilities and environmental interactions.
      - Describe each entity type's behavior (patrol routes, chase logic, attack patterns) and any special AI/behavioral features.
      - Describe any relevant systems required for the game (unique movement systems, health/resource systems, shop systems, etc.).
      - Output the final YAML snippet directly without writing to a file.
  expected_output: >
    A YAML snippet containing separate "Mechanics" and "AI" sections that include explicit parameters (e.g., gravity, friction, jump height) and detailed behavior definitions.

game_hierarchy_compilation:
  <<: *task_common
  agent: hierarchy_compiler
  depends_on:
    - game_hierarchy_extraction
    - mechanics_ai_extraction
  description: >
    Your task is to integrate the outputs from the extraction tasks into a single, cohesive YAML game hierarchy document.
    Follow these guidelines:
      - Merge the "GameFlow" snippet and the "Mechanics" and "AI" snippets into one structured document.
      - Add additional sections (e.g., Collectibles, UI, SpecialConsiderations) if they are referenced in the original description.
      - Ensure that the final document is logically organized and can serve as a complete guide for game development.
      - Output the final YAML snippet directly without writing to a file.
  expected_output: >
    A fully compiled YAML document that includes sections for GameFlow, Mechanics, AI, Collectibles, UI, and SpecialConsiderations, along with a brief summary of the integrated changes.


game_hierarchy_validation:
  <<: *task_common
  agent: hierarchy_evaluator
  depends_on:
    - game_hierarchy_compilation
  description: >
    Your task is to validate the game_hierarchy_compiled.yaml file against the original game specifications.
    Follow these guidelines:
      - Review the entire game_hierarchy_compiled.yaml file and ensure every game component (metadata, game flow, mechanics, AI, UI, collectibles, and special considerations) is present.
      - Cross-check each element against the provided game specifications.
      - If any component is missing, incomplete, or inconsistent, update the file using the write_file tool.
      - Ensure that the final file is accurate, comprehensive, and ready to guide game development.
      - When done with your updates, write the final version of the file using the `write_file` tool as "game_hierarchy_final.yaml". If no changes are needed, simply submit a copy of the existing file, named "game_hierarchy_final.yaml".
  expected_output: >
    A thoroughly validated and updated "game_hierarchy_final.yaml" file that accurately reflects the original game specifications.
    Provide a brief summary of any changes made.

