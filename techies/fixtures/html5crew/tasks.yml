_task_common: &task_common
  human_input: false
  async_execution: false

###############################################################################
# 1) Base Scaffold
###############################################################################
integrate_base_scaffold:
  <<: *task_common
  agent: game_architect
  description: >
    Establish the initial multi-file scaffold by referencing "game_hierarchy.xml" and any existing scaffold resources.
    1. Use the read_file tool (or batch_read_files if needed) to load "game_hierarchy.xml," confirming each scene,
       mechanic, and UI component defined there.
    2. If an existing scaffold file is mentioned or available (e.g., via read_scaffold), verify its contents:
       - Compare its placeholders to the requirements in "game_hierarchy.xml."
       - Decide whether to merge or replace them if outdated.
    3. If no suitable scaffold exists, create minimal essential files (e.g., "index.html" or "game.html," plus core JS modules)
       using the write_file tool.
    4. Insert placeholders (basic stubs or empty class definitions) for each key scene or component (title screen,
       gameplay scene, pause menu, etc.) described in "game_hierarchy.xml."
    5. Ensure a modular folder structure (e.g., separate directories for scenes, UI, assets) and correct JS/CSS references
       in the HTML.
    6. Make sure you decide what classes you add or omit based on the existing scaffold and "game_hierarchy.xml."
       You may need to create classes that do not exist in the original scaffold, and you may omit classes that are not necessary in the original scaffold. Your final decision should be based on the existing scaffold and "game_hierarchy.xml."
    7. If you need to create new files, ensure they are named appropriately and follow the naming conventions of the existing scaffold.

  expected_output: >
    A minimal, validated multi-file structure aligned with "game_hierarchy.xml," containing placeholders for each key
    scene or component. The output includes newly created or updated files (HTML, JS) ready for development.

###############################################################################
# 2) Initial Structure / Pseudocode
###############################################################################
html5_game_initial_structure:
  <<: *task_common
  agent: game_architect
  description: >
    Expand the multi-file scaffold with high-level function stubs or pseudocode to prepare for future development.
    1. Re-read "game_hierarchy.xml" (via read_file) for detailed mechanics (input handling, audio triggers, scene flow).
    2. Insert method stubs or pseudocode (e.g., initGame, loadAssets, handleInput, updateGameState, renderGame) into existing
       JS modules or newly created ones (only if absolutely necessary).
    3. Utilize write_file to add or update placeholders, clarifying where other agents will implement specific features
       (player controls, AI, UI logic, etc.).
    4. Set up basic HTML structures (DOM elements or canvases) and minimal CSS references, ensuring the placeholders anticipate
       transitions/interactions from future tasks (pause menu, main menu, etc.).
    5. If you need helper or factory files (e.g., asset loader, physics helper), create them only after verifying no existing
       file can serve the purpose.

  depends_on: [integrate_base_scaffold]
  expected_output: >
    A multi-file code framework containing key function stubs or pseudocode across relevant HTML/JS files, clarifying
    where subsequent agents will implement systems and logic. The structure reflects the game's scenes and aligns with
    "game_hierarchy.xml."

###############################################################################
# 3) Basic Player Controls
###############################################################################
implement_player_controls:
  <<: *task_common
  agent: core_gameplay_specialist
  description: >
    Implement core player movement, collisions, and input handling.
    1. Use read_file or batch_read_files to inspect the current scaffold (HTML and JS files) to identify where
       the player-control code should reside (e.g., "player.js" or "GameScene.js").
    2. Refer to "game_hierarchy.xml" for specifics (jump height, double-jump, run/walk speeds).
    3. Integrate collisions with environment (platforms, walls), either extending existing collision functions or creating
       new ones if needed.
    4. Write or update files with write_file, ensuring no duplication (e.g., reusing an existing physics helper if present).
    5. Test control responsiveness (horizontal/vertical movement, jumping, stopping) to ensure it matches design intent.

  depends_on: [html5_game_initial_structure]
  expected_output: >
    A functioning player control system integrated into the existing scaffold, allowing responsive movement
    and environment interaction consistent with "game_hierarchy.xml," with no redundant file creation.

###############################################################################
# 4) Core Gameplay (Health, AI, Collectibles)
###############################################################################
implement_core_gameplay:
  <<: *task_common
  agent: core_gameplay_specialist
  description: >
    Merge all major gameplay features into a unified step:
    1. Player Controls (Finalize movement/collision if incomplete).
    2. Health System: Add or update health/life mechanics, hooking into collisions/damage events.
    3. Enemy AI: Implement patrol, detection, attacking behaviors connected to the player's health/collision.
    4. Collectibles: Spawn items (coins, power-ups), detect pickups, update score/HUD in real time.

    Use read_file or batch_read_files to reference existing scaffold files and placeholders from prior tasks.
    Only create or expand modules (e.g., Player.js, Enemy.js, Collectible.js) if no suitable file exists.
    Keep code modular and ensure no duplication of collision or UI logic.
    Integrate these gameplay systems so they can be tested together before UI finalization.

  depends_on: [implement_player_controls]
  expected_output: >
    A cohesive “core gameplay” module that covers health, AI, and collectibles atop the existing player controls.
    Logic is consolidated in minimal files, ensuring everything works consistently and is ready for integration
    with UI, levels, and narrative per "game_hierarchy.xml."

###############################################################################
# 5) Level Layouts
###############################################################################
design_level_layouts:
  <<: *task_common
  agent: level_designer
  description: >
    Create and populate levels according to the difficulty progression/thematic details in "game_hierarchy.xml."
    1. Read existing scene or world files for structure, confirming whether new dedicated level files are needed.
    2. Place platforms, hazards, enemies, and collectibles in a balanced way. Ensure transitions (e.g., next-level triggers
       or boss areas) integrate with existing scene-management code.
    3. Reference or extend classes like "Enemy" or "Collectible" to avoid duplication. If necessary, create new layout config
       or data files with write_file.
    4. Playtest each layout to ensure synergy among movement, AI, and collectible distribution.

  depends_on: [implement_core_gameplay]
  expected_output: >
    Well-designed levels that effectively combine environment geometry, enemy placements, and item distributions,
    matching the intended difficulty and progression in "game_hierarchy.xml."

###############################################################################
# 6) UI Components
###############################################################################
design_ui_components:
  <<: *task_common
  agent: ui_designer
  description: >
    Build out the user interface, including menus, pause screens, and settings if the design requires them.
    1. Re-check placeholders in the scaffold or relevant UI logic. Use read_file/batch_read_files for CSS/markup references.
    2. Implement main menu flow (title screen, game start), pause functionality, and possibly a settings menu (volume control)
       if "game_hierarchy.xml" specifies it.
    3. Integrate real-time display elements (HUD) for health, score, or other stats introduced during gameplay.
    4. Update or create UI-specific files with write_file, ensuring no duplication of styling or code.

  depends_on: [html5_game_initial_structure]
  expected_output: >
    A fully realized menu system (title, pause, settings) plus a dynamic HUD consistent with the design specs in
    "game_hierarchy.xml," prepared for user interaction and future adjustments.

###############################################################################
# 7) Narrative Elements
###############################################################################
incorporate_narrative_elements:
  <<: *task_common
  agent: narrative_designer
  description: >
    Integrate story content (dialogues, cutscenes, triggered events) as per "game_hierarchy.xml."
    1. Use read_file to review updated code (UI, level transitions) to determine how best to add narrative triggers
       (e.g., boss defeat, item pickup, or entering new zone).
    2. If a dedicated dialogue/cutscene system doesn't exist, create one with write_file—only if you can't extend existing
       UI/scene managers.
    3. Synchronize each narrative beat with gameplay flow (e.g., cutscene after level complete), ensuring smooth transitions.
    4. Keep the experience cohesive and non-disruptive to the established scene/UI logic.

  depends_on: [design_level_layouts]
  expected_output: >
    A cohesive narrative overlay that triggers at key gameplay moments, adding depth and storytelling in line with
    "game_hierarchy.xml."

###############################################################################
# 8) Final Code Implementation
###############################################################################
html5_game_code_implementation:
  <<: *task_common
  agent: game_architect
  description: >
    Consolidate and finalize all systems into a cohesive multi-file codebase.
    1. Read the existing JS/HTML files (batch_read_files/list_files) to locate placeholders or stubs.
    2. Merge logic for controls, AI, UI, collectibles, narrative, and any helper utilities into stable modules.
    3. Use write_file to remove or unify redundant files or references (e.g., consolidating multiple collision systems).
    4. Confirm the game is fully playable, reflecting every system detailed in "game_hierarchy.xml."

  depends_on:
    - implement_core_gameplay
    - design_level_layouts
    - design_ui_components
    - incorporate_narrative_elements
  expected_output: >
    A feature-complete, multi-file platformer codebase integrating all functionalities from "game_hierarchy.xml," primed
    for final QA and release.

###############################################################################
# 9) Final Integration & QA
###############################################################################
final_integration_and_qa:
  <<: *task_common
  agent: game_architect
  description: >
    Combine thorough quality assurance with the final integration process, delegating any discovered tasks or fixes
    to specialized agents as needed.
    1. Conduct an end-to-end playtest and code review, identifying performance bottlenecks or major bugs (e.g., collisions,
       AI states, UI flow).
    2. Optimize resource usage (asset loading, memory management) and incorporate any performance improvements in existing files,
       using write_file to update them. 
    3. If the QA process reveals new tasks (bug fixes, code refactoring, additional features), delegate them back to the relevant
       agent (core_gameplay_specialist, ui_designer, etc.).
    4. Approve the final build only once all requirements in "game_hierarchy.xml" are satisfied and the entire game runs
       smoothly at the desired performance level.

  depends_on: [html5_game_code_implementation]
  expected_output: >
    A thoroughly tested and optimized game that meets or exceeds the standards set out in "game_hierarchy.xml."
    All major issues are addressed, and the project is cleared for final release.
