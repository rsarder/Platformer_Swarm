# Final game hierarchy file after validation and update
# Changes Made: Removed duplicate definitions and consolidated sections into a single comprehensive structure.

GameFlow:
  metadata:
    name: "Example Game"
    summary: "A challenging game that combines real-time combat, resource management, and puzzle solving. The game logic emphasizes strategic decision making under pressure while the user interface offers intuitive navigation with clear menus and a minimalistic HUD. Key features include multiple levels with progressive challenges, dynamic narrative events, and smooth transitions."
  levels:
    - main_menu:
        description: "Initial screen with options to start the game, adjust settings, view credits, or exit."
    - level_1:
        description: "Tutorial level designed to introduce the basic controls and core game mechanics."
    - level_2:
        description: "Intermediate level featuring resource management challenges and strategic combat encounters."
    - level_3:
        description: "Advanced level that combines intricate puzzles with combat scenarios, increasing overall difficulty."
    - boss_level:
        description: "Final stage where a challenging boss fight tests all the skills acquired through previous levels."
  transitions:
    - start_game: "Transition from main menu to level 1 when the player selects 'Start Game'."
    - level_progression: "Automatic transition to the next level upon completing the objectives of the current level."
    - climax_transition: "Shift from advanced levels to the boss level to trigger the narrative climax."
    - game_end: "Triggered when the player either defeats the final boss (win) or fails by losing all health or missing objectives (loss)."
  win_conditions:
    - "Defeat the final boss in the boss level."
    - "Successfully complete all levels by fulfilling specific objectives."
  lose_conditions:
    - "Player's health reaches zero."
    - "Failure to complete level objectives within required parameters."
  screens:
    - main_menu: "Primary menu including Start Game, Options, Credits, and Exit."
    - options_menu: "Screen for adjusting game settings like audio, graphics, and controls."
    - shop_screen: "Screen for purchasing in-game upgrades and items."
    - transition_screen: "Displayed between levels to indicate narrative progress or loading."
    - loading_screen: "Shown while assets are being loaded or during game state transitions."
  key_game_events:
    - "Tutorial completion where basic mechanics are introduced."
    - "Interim special events, including resource boosts and mini-boss encounters."
    - "Final boss encounter that serves as the narrative climax."
  narrative:
    summary: "The narrative follows a determined protagonist on a journey to save their world from an emerging threat. The story unfolds gradually through level progression and key events, blending rich backstory with escalating challenges that lead to a climactic final confrontation."

Mechanics:
  PlayerMovement:
    description: "Standard movement controls with keyboard/joystick support in a physics-based environment."
    physics:
      gravity: 9.8          # Gravitational acceleration in game units
      friction: 0.8         # Friction coefficient affecting momentum on ground surfaces
      jump:
        jump_height: 2.5    # Maximum height reachable with a jump
        initial_velocity: 5.0  # Initial upward velocity when jumping
    abilities:
      - name: "Attack"
        description: "Execute melee or ranged attacks depending on enemy proximity and scenario."
      - name: "Block/Defend"
        description: "Mitigate damage by activating a defensive stance during enemy encounters."
      - name: "Resource Management"
        description: "Manage and upgrade in-game resources to improve abilities and items via the shop system."
  EnvironmentalInteractions:
    - description: "Interact with doors, puzzles, and shop triggers to transition levels and purchase upgrades."
  Systems:
    health:
      description: "Tracks player health; reaching zero triggers a game over."
    level_progression:
      description: "Automatic advancement to subsequent levels upon fulfilling specific objectives, with increasing difficulty."
    puzzle:
      description: "Incorporated puzzle elements that influence narrative progression and level challenges."
    shop:
      description: "Screen for purchasing in-game upgrades and items, integrated within the shop system."

AI:
  BasicEnemies:
    description: "Standard hostile entities encountered primarily in the tutorial and intermediate levels."
    behavior:
      patrol: "Follow fixed waypoint routes until the player is detected."
      chase: "Switch to pursuit mode when the player is within detection range."
      attack: "Perform melee or range-based attacks upon reaching striking distance."
      states: ["idle", "patrol", "chase", "attack"]
  AdvancedEnemies:
    description: "Enhanced enemies with adaptive behaviors encountered during strategic combat and resource management challenges."
    behavior:
      patrol: "Use variable patrol routes and adaptive strategies based on environmental cues."
      chase: "Utilize line-of-sight detection along with aggressive pursuit tactics upon spotting the player."
      attack: "Alternate between melee and ranged attacks with built-in cooldowns to challenge the player."
      special_features: "Adapt difficulty dynamically in response to player performance; may switch tactics mid-engagement."
  BossEnemy:
    description: "A challenging boss entity featured in the final level with multiple combat phases."
    behavior:
      phases: "Multiple phases each with distinct attack patterns, requiring unique strategies to defeat."
      pattern:
        phase_1: "Focus on direct melee attacks at regular intervals."
        phase_2: "Transition to a mix of ranged and area-of-effect attacks, complicating player maneuverability."
        phase_3: "Incorporate environmental hazards and unpredictable maneuvers to limit player options."
      chase: "Aggressively pursue and corner the player, restricting escape routes during high-intensity attacks."
      special_features: "Features include charge attacks, temporary invulnerability phases, and environmental manipulation for dynamic battle conditions."

Collectibles:
  description: "No specific collectibles detailed in the original description. This section is reserved for future implementation if needed."

UI:
  description: "Intuitive and minimalistic user interface focused on clear navigation and easy access."
  elements:
    menus:
      - main_menu: "Start, Options, Credits, and Exit options provided at the game start."
      - options_menu: "Allows adjustments for audio, graphics, and control configurations."
      - shop_screen: "Interface for in-game purchases and upgrades."
    hud:
      description: "Minimalistic display showing essential information such as player health and current objectives."
    transitions:
      description: "Visual screens for level transitions and loading states to maintain narrative flow."

SpecialConsiderations:
  description: "This section highlights unique narrative events, dynamic difficulty adjustments, and game transitions."
  details:
    - "Dynamic narrative events are triggered upon reaching key game milestones."
    - "Difficulty adjustments in enemy behavior based on player performance to keep the game challenging."
    - "Smooth transitions between levels ensure continuity and immersion in the narrative."
