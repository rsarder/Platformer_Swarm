_task_common: &task_common
  human_input: false
  async_execution: false

html5_game_coding:
  <<: *task_common
  agent: html5_game_architect
  description: >
    Read the game hierarchy file "game_hierarchy.xml" to understand the game hierarchy, specifications and details.
    Write a perfect HTML5, CSS, and JavaScript code.
    Make sure that the final code represent a complete and playable game as detailed in the game layout and specifications.
    Test and review the code with every change.
    Sound is required for the game.
    Delegate the task of coding the different parts of the game to the most fitting agents.
    For any tasks that do not fit any specialized agents, delegate the task to the html5_game_engineer agent.
    Agents must be conscious of their coworkers' code, and must ensure they refer to already exisiting components. If a necessary component does not exist, create it in the code or delegate the task of doing so to the right agent.
    Delegate the task of generating and integrating a comprehensive Rules and Instructions menu into the "game.html" to html5_game_rules_engineer agent based on the game hierarchy and interactions outlined in game_hierarchy.xml and game.html files.
    Delegate the task of downloading the sound resources as per the "game_hierarchy.xml" to html5_sound_engineer agent.
    Delegate the task of integrating the downloaded sounds to html5_sound_integrator_agent agent. Make sure that html5_sound_integrator_agent agent consult with co-workers to carefully integrate the downloaded sound files provided by the sound engineer into the "game.html" file using the <audio> tags at their appropriate places.
    Delegate the task of testing the code and giving feedback to the html5_game_tester.
    Do not finalize your answer until the html5_game_tester says the game is complete and playable, and you have met all requirements.
    Your final output should include code in a single file for the game and only HTML5 code for the game.
  expected_output: >
    After fill out all the requirements and complete the file "game.html", say "I have successfully developed the game saved in "game.html", as described per the game specification and game_hierarchy.xml file."

html5_game_initial_structure:
  <<: *task_common
  agent: html5_game_architect
  description: |
    You are tasked with creating the initial foundational structure for the HTML5 game in a single file called "game.html," but without fully implementing the complete logic. Instead, you will:

    **Setup:**
    - **Review the "game_hierarchy.xml" File:**
      - Carefully read "game_hierarchy.xml" to understand every mechanic, component, and system (UI, audio, rules, etc.).
      - Make a list of all the core functionality and systems needed.

    **Core Task:**
    - **Functions & Placeholder Pseudocode:**
      - In "game.html," define all the major functions and methods that the game will need, but do not fully implement them yet.  
      - Use placeholder bodies or clear pseudocode within each function to outline their logic.  
      - Ensure your pseudocode clearly reflects the dependencies and sequence of calls between functions (e.g., game initialization, input handling, audio loading, UI updates, etc.).  

    - **Example Structure:**
      - **HTML Structure:**  
        Basic HTML layout with `<head>` and `<body>`. Inside `<body>`, placeholder `<div>`s or `<canvas>` elements for game rendering, along with any needed placeholders for UI (menus, HUD elements, etc.).
      - **CSS:**  
        Include minimal CSS in a `<style>` tag or placeholder references. Enough to illustrate layout but not final.
      - **JavaScript/Pseudocode:**  
        - A `<script>` section containing functions such as:
          - `initGame()`
          - `loadAssets()`
          - `handleInput()`
          - `updateGameState()`
          - `renderGame()`
          - `playSoundEffect()`
          - `showInstructions()`
          - …and any other functions derived from the game_hierarchy.xml.  
        - Provide high-level pseudocode detailing what each function will eventually do without giving final code.
      
    **Delegation:**
    - **Agents Involved:**
      - If any specialized functionality is identified (e.g., `html5_game_engineer`, `html5_sound_engineer`, etc.), outline how they will be brought in to finalize certain pieces of the code in later tasks. However, do not implement those sections in detail yet.
    
    **Testing & Review:**
    - Since this is an initial skeleton, the `html5_game_tester` or other testers can only confirm that function stubs/pseudocode exist for every part of the final game plan, not that they are fully functional.

    **Final Step:**
    - **Save the File:**
      - Use the `write_file` tool to save your partial game structure to "game.html".
    - **Output Confirmation:**
      - Conclude with a statement indicating you have created a placeholder structure containing all necessary functions in "game.html."
  expected_output: >
    After creating the partial "game.html" with all function definitions and pseudocode, say "I have created the initial structured file 'game.html' with all necessary functions as placeholders, as outlined in the game_hierarchy.xml."


html5_game_code_implementation:
  <<: *task_common
  agent: html5_game_architect
  description: |
    You are tasked with taking the "game.html" file containing placeholder/pseudocode functions and completing the actual logic for each function so that the game is fully functional. This includes replacing pseudocode and placeholders with final HTML, CSS, and JavaScript code.

    **Setup:**
    - **Review the Existing Placeholder Code:**
      - Open the "game.html" file generated from the previous task.
      - Identify each placeholder function or pseudocode block.

    **Core Task:**
    - **Full Implementation:**
      - For each placeholder function (e.g., `initGame()`, `handleInput()`, `updateGameState()`, etc.), replace all pseudocode with the actual code.
      - Ensure your final code:
        - Reflects the logic defined in the "game_hierarchy.xml" (mechanics, UI interactions, audio triggers, etc.).
        - Properly handles user input, updates the game state, and renders updates to the screen.
        - Integrates any required resources (images, sprites, or audio files) as specified in the hierarchy.
        - Includes all essential rules, instructions, menus, and HUD elements detailed in the hierarchy.

    - **Example Implementation Areas:**
      - **Game Initialization:**  
        - Load assets (images, sounds), create game objects, set up initial states.
      - **Input Handling:**  
        - Capture keyboard or mouse events, convert them into in-game actions.
      - **Core Loop:**  
        - Update the game state and redraw the screen (if using a game loop).
      - **Audio Integration:**  
        - Ensure each event triggers the correct sound effect or music track, using `<audio>` tags or the Web Audio API, as planned.
      - **UI & Instructions Menu:**  
        - Implement the full “Rules and Instructions” menu using the relevant agent’s code (e.g., `html5_game_rules_engineer`), and ensure it ties into the rest of the interface.

    **Delegation:**
    - **Agents & Code Contributions:**
      - Collaborate with specialized agents (e.g., `html5_game_engineer`, `html5_sound_integrator_agent`, `html5_game_rules_engineer`) to replace pseudocode with final implementations.
      - Confirm each segment is working properly in the integrated environment.

    **Testing & Review:**
    - **Continuous Testing:**
      - Involve the `html5_game_tester` to test each newly completed part.  
      - Verify that no errors occur and that gameplay flow matches the "game_hierarchy.xml" design.

    **Final Step:**
    - **Save the File:**
      - Use the `write_file` tool to overwrite "game.html" with the completed, functional code.
    - **Output Confirmation:**
      - Once the file is fully implemented, conclude with a statement confirming that all pseudocode has been replaced and the game is ready for final review.
  expected_output: >
    After finalizing the code for all pseudocode placeholders in "game.html," say "I have replaced all placeholder and pseudocode with fully implemented logic in 'game.html' per the specifications in game_hierarchy.xml."


html5_game_final_validation:
  <<: *task_common
  agent: html5_game_tester
  description: |
    Your task is to validate and confirm that the "game.html" file now contains a complete, playable HTML5 game adhering to all details in "game_hierarchy.xml."

    **Setup:**
    - **Cross-Verification with Game Hierarchy:**
      - Thoroughly read and compare "game.html" against "game_hierarchy.xml."
      - Ensure every mechanic, component, feature, and rule described in the hierarchy is found and functional within the code.

    **Validation Process:**
    - **Check Feature Completeness:**
      - Verify that all UI, audio, and game mechanics are implemented and match the hierarchy’s requirements.
      - Confirm the presence of a Rules/Instructions menu with correct functionality.
      - Ensure that any specialized features (e.g., advanced physics, achievements, AI behavior, or dynamic UI elements) are implemented as specified.

    - **Test Gameplay Flow:**
      - Play through the game from start to finish, checking for:
        - Correct initialization, state changes, scoring, or leveling up (if relevant).
        - Audio triggers or music playback at the right times.
        - Accurate responses to player inputs or interactions.

    - **Edge Cases & Robustness:**
      - Validate that the code handles invalid inputs or unusual states gracefully.
      - Confirm that no crashes or exceptions occur.

    **Enhancement & Final Adjustments:**
      - If any inconsistencies or missing features are found, log them and delegate tasks to update to the relevant agent.  
      - Re-test until all issues are resolved.

    **Final Step:**
    - **Confirmation of Completion:**
      - Once the game is verified as complete and playable, finalize the “game.html” and report that all requirements have been met.

    **Output Guidelines:**
    - Conclude only when you can affirm that the “game.html” file is thoroughly validated and consistent with “game_hierarchy.xml.”

  expected_output: >
    After validating that "game.html" is complete, say "All features have been validated against game_hierarchy.xml, and the game is confirmed fully playable in 'game.html'."

html5_game_validation:
  <<: *task_common
  agent: html5_validation_agent
  description: >
    Read the game hierarchy file "game_hierarchy.xml" to understand the game hierarchy, specifications and details.
    Read and analyze the game file "game.html" to understand what has been coded so far and what has not been coded.
    Think about what needs to be updated, changed or added to the code to make it a fully functional game with all aspects listed in the game hierarchy.
    Use the write_file tool to write to the file "game_updates.txt" a list of what needs to be updated, changed or added to make the game fully functional.
    Include detailed descriptions and instructions on how to make these updates, changes or additions.
  expected_output: >
    A detailed list writtent to the file "game_updates.txt" of updates, changes and additions with descriptions and instructions on how to implement these updates, changes and additions.
    
html5_game_update:
  <<: *task_common
  agent: html5_game_architect
  description: >
    Read the game updates file "game_updates.txt" to understand the game updates.
    Write a perfect HTML5, CSS, and JavaScript code.
    Make sure that the final code represent a complete and playable game as detailed in the game layout and specifications.
    Test and review the code with every change.
    Sound is required for the game.
    Delegate the task of coding the different parts of the game to the most fitting agents.
    For any tasks that do not fit any specialized agents, delegate the task to the html5_game_engineer agent.
    Agents must be conscious of their coworkers' code, and must ensure they refer to already exisiting components. If a necessary component does not exist, create it in the code or delegate the task of doing so to the right agent.
    Delegate the task of generating and integrating a comprehensive Rules and Instructions menu into the "game.html" to html5_game_rules_engineer agent based on the game hierarchy and interactions outlined in game_hierarchy.xml and game.html files.
    Delegate the task of downloading the sound resources as per the "game_hierarchy.xml" to html5_sound_engineer agent.
    Delegate the task of integrating the downloaded sounds to html5_sound_integrator_agent agent. Make sure that html5_sound_integrator_agent agent consult with co-workers to carefully integrate the downloaded sound files provided by the sound engineer into the "game.html" file using the <audio> tags at their appropriate places.
    Delegate the task of testing the code and giving feedback to the html5_game_tester.
    Do not finalize your answer until the html5_game_tester says the game is complete and playable, and you have met all requirements.
    Your final output should include code in a single file for the game and only HTML5 code for the game.
  expected_output: >
    After fill out all the requirements and complete the file "game.html", say "I have successfully developed the game saved in "game.html", as described per the game specification and game_hierarchy.xml file."
########################################################################
integrate_base_scaffold:
  <<: *task_common
  agent: game_architect
  description: >
    Retrieve and verify the base scaffold (scaffold.html) using read_scaffold. Confirm that all placeholder scenes and inline JavaScript modules are loaded correctly and meet baseline technical requirements.
  expected_output: >
    The base scaffold is successfully loaded and accessible, providing a verified foundation for subsequent development.

implement_player_controls:
  <<: *task_common
  agent: gameplay_programmer
  description: >
    Enhance the GameScene by implementing robust player controls, including responsive input handling (WASD/Space), gravity application, and accurate collision detection.
  expected_output: >
    A fully responsive player character that moves, jumps, and collides with level geometry according to design specifications.
  depends_on: [integrate_base_scaffold]

integrate_health_system:
  <<: *task_common
  agent: gameplay_programmer
  description: >
    Implement a health system by integrating collision-based damage detection, player health/life tracking, and respawn logic. Ensure state transitions are triggered upon player damage or death.
  expected_output: >
    A robust health system that decrements health appropriately, triggers respawn or game over states, and communicates with the UI for feedback.
  depends_on: [implement_player_controls]

develop_enemy_ai:
  <<: *task_common
  agent: enemy_ai_developer
  description: >
    Develop adaptive enemy AI routines including patrol, detection, and attack behaviors. Ensure that enemy collisions with the player interact with the health system as specified.
  expected_output: >
    Enemy entities demonstrate defined behaviors and interact with the player in accordance with the validated hierarchy.
  depends_on: [implement_player_controls]

create_collectibles_system:
  <<: *task_common
  agent: collectibles_specialist
  description: >
    Implement a collectibles system to spawn items (e.g., coins, power-ups), handle collision-based pickups, and update score variables, with real-time integration into the HUD.
  expected_output: >
    Collectible items spawn and are collected as per design, with the score and HUD updating accurately upon pickup.
  depends_on: [implement_player_controls]

design_ui_components:
  <<: *task_common
  agent: ui_designer
  description: >
    Develop interactive UI components including main menus, pause screens, settings interfaces (with volume control), and an in-game HUD that reflect the specifications outlined in the game hierarchy.
  expected_output: >
    Functional and responsive UI screens enabling seamless game navigation and accurate display of game metrics.
  depends_on: [integrate_base_scaffold]

design_level_layouts:
  <<: *task_common
  agent: level_designer
  description: >
    Design and implement engaging level layouts with platforms, hazards, and environmental features that adhere to difficulty scaling and progression guidelines from the hierarchy.
  expected_output: >
    Multiple levels are implemented with appropriate spatial design and interactive elements, consistent with the validated hierarchy.
  depends_on: [implement_player_controls, develop_enemy_ai, create_collectibles_system]

integrate_audio_effects:
  <<: *task_common
  agent: sound_designer
  description: >
    Incorporate audio components including sound effects and background music, as well as visual effects such as particle systems and screen shakes, to enhance player feedback and immersion.
  expected_output: >
    Audio and visual effects are fully integrated, with event-driven triggers aligning with gameplay actions, and volume control integrated within the UI.
  depends_on: [integrate_base_scaffold]

incorporate_narrative_elements:
  <<: *task_common
  agent: narrative_designer
  description: >
    Develop and integrate narrative components including dialogue sequences, cutscenes, and story triggers, ensuring they align with level transitions and key game events as defined in the hierarchy.
  expected_output: >
    Narrative elements are seamlessly incorporated, with scripted events and dialogues triggering at appropriate times during gameplay.
  depends_on: [design_level_layouts]

perform_optimization_and_testing:
  <<: *task_common
  agent: performance_optimiser
  description: >
    Analyze, refactor, and optimize the entire codebase to ensure efficient resource usage and stable frame rates, while conducting systematic QA testing across all modules.
  expected_output: >
    The game achieves optimal performance metrics with minimal bugs, meeting the quality standards set forth in the hierarchy.
  depends_on:
    - implement_player_controls
    - develop_enemy_ai
    - create_collectibles_system
    - design_ui_components
    - design_level_layouts
    - integrate_audio_effects
    - incorporate_narrative_elements

final_integration_and_system_testing:
  <<: *task_common
  agent: game_architect
  description: >
    Merge all module contributions into a cohesive game product and perform end-to-end system testing to verify that gameplay, AI, UI, audio, and narrative elements operate in harmony as specified in the validated hierarchy.
  expected_output: >
    A fully integrated, feature-complete platformer game that adheres to the design specifications and is ready for release.
  depends_on:
    - integrate_base_scaffold
    - implement_player_controls
    - integrate_health_system
    - develop_enemy_ai
    - create_collectibles_system
    - design_ui_components
    - design_level_layouts
    - integrate_audio_effects
    - incorporate_narrative_elements
    - perform_optimization_and_testing
###################################################################

