_crew_common: &crew_common
  cache: false
  max_iter: 100
  memory: false


hierarchy_crew_v2:
  <<: *crew_common
  agents:
    - hierarchy_systems_engineer
    - hierarchy_mechanics_engineer
    - hierarchy_architect_v2
    - hierarchy_entity_engineer_v2
    - hierarchy_validator

  tasks:
    - hierarchy_systems_generation
    - hierarchy_mechanics_generation
    - game_hierarchy_representation_v2
    - game_hierarchy_inner_layers_task
    - game_hierarchy_validation


