_task_common: &task_common
  human_input: false
  async_execution: false

######################################################################
# 1) Base Scaffold
######################################################################
integrate_base_scaffold:
  <<: *task_common
  agent: game_architect
  description: >
    Establish the initial multi-file scaffold by referencing "game_hierarchy.xml" and any existing scaffold resources.
    1. Use the **read_file** tool (or **batch_read_files** if needed) to load "game_hierarchy.xml," confirming each scene,
       mechanic, and UI component defined there.
    2. If an existing scaffold file is mentioned or available (e.g., via **read_scaffold**), verify its contents.
       - Compare its placeholders to the requirements in "game_hierarchy.xml."
       - Decide whether to merge them or replace them if outdated.
    3. If no suitable scaffold exists, create minimal essential files (e.g., "index.html" or "game.html," plus core JavaScript
       modules) using the **write_file** tool.
    4. Insert placeholders (basic stubs or empty class definitions) for each key scene or component (title screen, gameplay scene,
       pause menu, etc.) described in "game_hierarchy.xml."
    5. Ensure that your folder structure is modular (e.g., separate directories for scenes, UI, assets, etc.) and that your
       references to JavaScript or CSS files are correct in the HTML.

  expected_output: >
    A minimal, validated multi-file structure aligned with "game_hierarchy.xml," containing placeholders for each key scene
    or component. The output includes newly created or updated files (HTML, JS) that are ready for further development.


######################################################################
# 2) Initial Structure / Pseudocode
######################################################################
html5_game_initial_structure:
  <<: *task_common
  agent: game_architect
  description: >
    Expand the multi-file scaffold with high-level function stubs or pseudocode to prepare for future development.
    1. Re-read "game_hierarchy.xml" (via **read_file**) for detailed mechanics (input handling, audio triggers, scene flow).
    2. Insert method stubs or pseudocode (e.g., initGame, loadAssets, handleInput, updateGameState, renderGame, etc.)
       into the existing JS modules or newly created ones (only if absolutely necessary).
    3. Utilize **write_file** to add or update these placeholders, clarifying where other agents will implement specific features
       (player controls, AI, UI logic, etc.).
    4. Set up basic HTML structures (DOM elements or canvases) and minimal CSS references, ensuring the placeholders anticipate
       transitions and interactions from future tasks (e.g., pause menu, main menu).
    5. If you need additional helper or factory files (e.g., a dedicated asset loader, physics helper), create them only after
       verifying no existing file can serve the purpose.

  depends_on: [integrate_base_scaffold]
  expected_output: >
    A multi-file code framework containing key function stubs or pseudocode across relevant HTML/JS files, clarifying
    where subsequent agents will implement their systems and logic. The structure should reflect the game's scenes
    and align with the specifications in "game_hierarchy.xml."


######################################################################
# 3) Player Controls
######################################################################
implement_player_controls:
  <<: *task_common
  agent: gameplay_programmer
  description: >
    Implement core player movement, collisions, and input handling.
    1. Use **read_file** or **batch_read_files** to examine the current scaffold (HTML and JS files) to identify where
       the player-control code belongs (e.g., a "player.js" module or a main "GameScene.js" file).
    2. Refer to "game_hierarchy.xml" for details on movement mechanics (e.g., jump height, double-jump, run/walk speeds).
    3. Integrate collisions with the environment (platforms, walls) using either existing collision functions or new ones if needed.
    4. Write or update files with **write_file**, ensuring no duplication (e.g., reusing an existing physics helper if present).
    5. Test the responsiveness of controls to verify that horizontal/vertical movement, jumping, and stopping behave as intended.

  depends_on: [html5_game_initial_structure]
  expected_output: >
    A functioning player control system integrated into the existing scaffold, allowing responsive movement
    and environment interaction consistent with "game_hierarchy.xml." No unnecessary file duplication.


######################################################################
# 4) Health System
######################################################################
integrate_health_system:
  <<: *task_common
  agent: gameplay_programmer
  description: >
    Implement a health/life mechanic if specified by "game_hierarchy.xml."
    1. Re-check any existing placeholders or stubs for player attributes, collisions, or UI updates via **read_file**
       to avoid creating duplicate logic.
    2. Add a health property to the player (or create a dedicated "HealthManager" module) and update it on damage
       events, referencing collisions or triggers that cause harm.
    3. Use **write_file** to integrate real-time HUD updates so players can see their health status.
    4. If the design calls for respawn or game-over sequences, hook these into your scene transition or
       state-management code.

  depends_on: [implement_player_controls]
  expected_output: >
    A robust health system that cleanly integrates with existing collision/logic, displays health changes in the HUD,
    and triggers game-over or respawn flows in alignment with "game_hierarchy.xml."


######################################################################
# 5) Enemy AI
######################################################################
develop_enemy_ai:
  <<: *task_common
  agent: enemy_ai_developer
  description: >
    Implement enemy behavior logic (patrol, detect, attack) per "game_hierarchy.xml."
    1. Use **batch_read_files** or **list_files** to locate relevant modules (e.g., a "Player" class, collision systems)
       and confirm no duplication is necessary.
    2. Reference player collisions and the health system to inflict damage or respond to attacks.
    3. Create or extend an "Enemy" class or AI modules (if no suitable file exists, do so with **write_file**),
       detailing states (patrolling, chasing, attacking).
    4. Ensure that each AI routine is modular and can be reused for different enemy types if the hierarchy dictates multiple variations.

  depends_on: [implement_player_controls]
  expected_output: >
    Dynamic, scriptable enemy AI that interacts correctly with the player and environment, respecting the
    health system and avoiding code duplication or unnecessary new files.


######################################################################
# 6) Collectibles System
######################################################################
create_collectibles_system:
  <<: *task_common
  agent: collectibles_specialist
  description: >
    Introduce a collectibles system for items such as coins or power-ups.
    1. Review existing collision detection and scene code with **read_file** to identify if you can reuse logic
       rather than reinvent it.
    2. Implement item spawning (e.g., random or placed) and a collision-based pickup mechanism that updates
       score or stats in real time.
    3. Use **write_file** to ensure the HUD or UI system reflects these pickups instantly.
    4. If power-ups require temporary buffs or transformations, integrate them into existing player or
       game-state code, only creating new modules if necessary.

  depends_on: [implement_player_controls]
  expected_output: >
    A reliable collectibles framework providing real-time feedback on pickup events, updating game stats,
    and integrating smoothly with the existing multi-file structure, consistent with "game_hierarchy.xml."


######################################################################
# 7) UI Components
######################################################################
design_ui_components:
  <<: *task_common
  agent: ui_designer
  description: >
    Build out the user interface, including menus, pause screens, and settings if required.
    1. Re-check the initial placeholders in the scaffold and any relevant UI logic. Use **read_file** or
       **batch_read_files** to locate existing CSS or markup references.
    2. Implement the main menu flow (title screen, start game), pause functionality, and possibly a settings
       menu with volume control, if "game_hierarchy.xml" specifies it.
    3. Integrate real-time display elements (HUD) for health, score, or other stats introduced in previous tasks.
    4. Update or create UI-specific files using **write_file**, ensuring no duplication of code or styling.

  depends_on: [html5_game_initial_structure]
  expected_output: >
    A fully realized menu system (title, pause, settings) and dynamic HUD consistent with the style and structure
    in "game_hierarchy.xml," ready for user interaction and further refinement.


######################################################################
# 8) Level Layouts
######################################################################
design_level_layouts:
  <<: *task_common
  agent: level_designer
  description: >
    Create and populate one or more levels to fulfill the difficulty progression and thematic elements in "game_hierarchy.xml."
    1. Read existing scene or world files to see how content is structured, confirming whether new dedicated
       level files are needed.
    2. Place platforms, hazards, enemies, and collectibles in a balanced way. Ensure any transitions (e.g., next
       level triggers or boss rooms) integrate seamlessly with existing scene-management code.
    3. Reference or extend existing classes (e.g., "Enemy" or "Collectible") to avoid duplication. If necessary,
       create new layout configuration or data files with **write_file**.
    4. Playtest each layout to ensure synergy between movement, AI, and collectible distribution.

  depends_on:
    - implement_player_controls
    - develop_enemy_ai
    - create_collectibles_system
  expected_output: >
    Well-designed levels that effectively combine geometry, enemy placements, and item distributions,
    reflecting the intended difficulty and progression of "game_hierarchy.xml."


######################################################################
# 9) Narrative Elements
######################################################################
incorporate_narrative_elements:
  <<: *task_common
  agent: narrative_designer
  description: >
    Integrate story content such as dialogues, cutscenes, and triggered story events according to "game_hierarchy.xml."
    1. Use **read_file** to review the updated code (UI, level transitions) and see how best to incorporate narrative
       triggers (e.g., talk to an NPC, defeat a boss).
    2. If a narrative or dialogue system doesn't exist, create one with **write_file**—but only if you can't extend
       an existing system (e.g., a UI overlay or scene manager).
    3. Ensure that each narrative beat or event is synchronized with gameplay flow (e.g., on level completion, spawn a
       cutscene or dialogue).
    4. Keep the transitions smooth to avoid jarring the player out of the experience.

  depends_on: [design_level_layouts]
  expected_output: >
    A cohesive narrative overlay that triggers at relevant points in gameplay, adding depth and storytelling
    without disrupting the established scene flow or UI logic, fully aligning with "game_hierarchy.xml."


######################################################################
# 10) Final Code Implementation
######################################################################
html5_game_code_implementation:
  <<: *task_common
  agent: game_architect
  description: >
    Consolidate and finalize all systems into a cohesive multi-file codebase.
    1. Read the existing set of JS/HTML files with **batch_read_files** or **list_files** to see where placeholders
       remain. Replace pseudocode or stubs with functional code.
    2. Merge logic for player controls, AI, UI, collectibles, narrative, and any helper utilities into stable modules.
    3. Use **write_file** to remove or unify redundant files or references (e.g., consolidating multiple collision systems).
    4. Confirm that the game is now fully playable—start to finish—reflecting every system detailed in "game_hierarchy.xml."

  depends_on:
    - integrate_health_system
    - develop_enemy_ai
    - create_collectibles_system
    - design_ui_components
    - incorporate_narrative_elements
  expected_output: >
    A feature-complete, multi-file platformer codebase that integrates all functionalities described in "game_hierarchy.xml,"
    ready for performance tuning and final polish.


######################################################################
# 11) Optimization & Testing
######################################################################
perform_optimization_and_testing:
  <<: *task_common
  agent: performance_optimiser
  description: >
    Analyze and refine the entire codebase for performance.
    1. Identify bottlenecks in rendering, collision checks, or AI updates using any profiling approaches. 
    2. Optimize resource usage (asset loading, memory management) in existing files, only adding new utility modules if
       they significantly reduce complexity or improve performance.
    3. Conduct comprehensive tests (controls, AI, collectibles, UI transitions) to ensure no introduced bugs or regressions.
    4. Use **write_file** to incorporate performance fixes and improvements across the multi-file structure.

  depends_on: [html5_game_code_implementation]
  expected_output: >
    A polished, stable game with optimized code and minimal critical errors. Frame rates and load times should be consistent
    with the game's target platforms and design specs, validated through thorough QA testing.


######################################################################
# 12) Final Integration & System Testing
######################################################################
final_integration_and_system_testing:
  <<: *task_common
  agent: game_architect
  description: >
    Perform a last integration pass and thorough system-level testing to confirm every subsystem meets "game_hierarchy.xml" requirements.
    1. Use **batch_read_files** to load all relevant code modules and verify each system (controls, AI, UI, levels, narrative, optimization).
    2. Conduct start-to-finish playtests, checking transitions, difficulty balance, performance stability, and any final edge cases.
    3. If minor adjustments are needed (e.g., bug fixes), use **write_file** to update the relevant files. 
    4. Approve the final build once all requirements are satisfied and the entire game is coherent and release-ready.

  depends_on: [perform_optimization_and_testing]
  expected_output: >
    The multi-file project is fully validated, satisfying every specification from "game_hierarchy.xml."
    All components operate in harmony, and the final build is approved for deployment or release.
