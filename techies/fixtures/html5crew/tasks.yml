html5_level_config_creation:
  <<: *task_common
  agent: html5_game_engineer
  description: |
    You are tasked with creating the `level-config.json` file, which defines the structure, layout, and configuration data for levels in the game.

    **Setup:**
    - Use the `read_file` tool to open and review `task-level-config.md`.
    - Extract all relevant parameters from the game_hierarchy.xml as summarized in the task file, including:
      - Level metadata
      - Player/enemy spawn points
      - Background environment settings
      - Layout configuration
      - References to assets or difficulty modifiers

    **Core Task:**
    - Define a JSON structure that supports:
      - Multiple levels, each with its own ID or name
      - Initial positions for the player and enemies
      - List of entities or objects to place in the level (coins, hazards, power-ups, etc.)
      - Background settings, such as music or tilemap
      - Win/loss conditions or exit points
      - Level-specific settings such as time limits or score targets

    - Make the structure extendable so future levels can be easily added or edited.

    - Include at least one fully defined sample level entry in the JSON output for testing and template reference.

    **Final Step:**
    - Use the `write_file` tool to save the resulting structure as `level-config.json`.

  expected_output: >
    The level-config.json file has been created with a flexible structure that defines all key parameters for at least one sample level.

html5_game_file_structure_and_index:
  <<: *task_common
  agent: html5_game_engineer
  description: |
    Read task-html-scaffold.md, to understand all neccessary elements for `index.html` and `styles.css`.
    You are tasked with creating the final foundational structure and entry point for the HTML5 game project. This task should be completed only after all other game modules, scenes, entities, and configuration files have already been implemented.

    You will create:
    - `index.html` – The main HTML entry point that loads the canvas and links all JavaScript and CSS files required to run the game.
    - `styles.css` – The main CSS file defining layout and visual structure for the game canvas, menus, and HUD.

    **Setup:**
    - Use the `list_files` tool to view the directory and identify all existing game-related JavaScript files (scenes, systems, entities, config, etc.).

    **Core Task:**
    - **Create and implement `index.html`:**
      - Include a valid HTML5 structure with `<head>` and `<body>`.
      - Add a `<canvas>` or `<div id="game-container">` for the game display.
      - Link the `styles.css` file in the `<head>`.
      - Add `<script>` tags for each JavaScript file discovered via `list_files`. Ensure they are ordered in a way that respects dependencies (e.g., engine config before scenes, core systems before entities).
      - If the game engine (e.g., Phaser) is not included in the file list, add a CDN reference.

    - **Create and implement `styles.css`:**
      - Style the game canvas or container to fill the screen appropriately.
      - Add basic CSS for menus, overlays, and HUD elements as needed.

    **Final Step:**
    - Use the `write_file` tool to save the completed `index.html` and `styles.css` files.

  expected_output: >
    The project scaffold has been finalized. index.html and styles.css have been created, and all necessary files discovered via list_files have been correctly linked. The HTML entry point is now ready for gameplay testing.
  callback: playwrite_test

html5_game_debug_and_fix:
  <<: *task_common
  agent: html5_game_debugger
  description: |
    You are tasked with reviewing and fixing all browser-based errors in the game after all other implementation tasks have been completed.

    **Setup:**
    - Use the `read_file` tool to open and analyze `browser_errors.md`.
    - Review the list of captured browser errors and warnings, including:
      - JavaScript exceptions
      - File load failures
      - Missing exports or import paths
      - Runtime logic errors or undefined variables

    **Core Task:**
    - For each error listed in `browser_errors.md`:
      - Identify which file the error is coming from using line numbers, filenames, or function names.
      - Use the `read_file` tool to inspect that file and locate the cause of the error.
      - Use the `write_file` tool to apply a fix for the error in the appropriate source file.
    - Ensure that:
      - All syntax and logic errors are corrected.
      - All imports/exports match across modules.
      - There are no missing variables or undefined functions.
      - All browser console errors from the report are resolved.

    **Scope:**
    - This task applies to all files in the game project, including but not limited to:
      - `index.html`
      - All `scenes-*.js`
      - `mechanics-systems.js`, `entities-*.js`, `game.js`
      - Stylesheets and JSON config files (if referenced in the error)

    **Final Step:**
    - Once all fixes are applied, use the `write_file` tool to update the corrected files.
    - Include a summary list in your final message indicating:
      - What files were changed
      - What errors were fixed

  expected_output: >
    All errors described in browser_errors.md have been fixed across the relevant game files. A summary of file changes and resolved errors is included below.

