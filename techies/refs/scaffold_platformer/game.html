<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Phaser Platformer Scaffold (Reference Only)</title>
    <!-- Include Phaser 3 library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
      body {
        margin: 0;
        background: #121212; /* page background behind the game canvas */
        font-family: sans-serif;
      }
      #game {
        overflow: hidden; /* container for the game canvas */
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      /*
      NOTE:
      1) This code is intended to serve as a conceptual reference. 
      2) You should modularize the game accordingly based on functionality and consistency, 
          and follow best coding standards and guidelines.
      3) No actual gameplay “mechanics” are implemented here. 
         In a real game, you’d add collisions, movement logic, etc. 
      4) No assets or sounds are used; placeholders are provided for demonstration.
      5) This scaffold is meant to show multiple scenes and basic structure
         for a potential platformer or menu-driven Phaser game. 
    */

      // BootScene: Initial scene that might load assets if any existed.
      // Immediately transitions to MenuScene.
      class BootScene extends Phaser.Scene {
        constructor() {
          super({ key: "BootScene" });
        }
        preload() {
          // Here you would normally load images, audio, or other assets.
        }
        create() {
          // After any required setup, move to the menu.
          this.scene.start("MenuScene");
        }
      }

      // MenuScene: Main menu with Start, Settings, Instructions buttons.
      class MenuScene extends Phaser.Scene {
        constructor() {
          super({ key: "MenuScene" });
        }
        create() {
          // Simple background color
          this.cameras.main.setBackgroundColor("#24252A");

          // Title
          const titleText = this.add
            .text(400, 100, "My Phaser Game", {
              font: "32px Arial",
              fill: "#ffffff",
            })
            .setOrigin(0.5);

          // Menu options
          const startText = this.add
            .text(400, 200, "Start Game", {
              font: "20px Arial",
              fill: "#00ff00",
            })
            .setOrigin(0.5);

          const settingsText = this.add
            .text(400, 250, "Settings", {
              font: "20px Arial",
              fill: "#ffffff",
            })
            .setOrigin(0.5);

          const instrText = this.add
            .text(400, 300, "Instructions", {
              font: "20px Arial",
              fill: "#ffffff",
            })
            .setOrigin(0.5);

          // Make menu texts interactive
          startText.setInteractive({ useHandCursor: true });
          settingsText.setInteractive({ useHandCursor: true });
          instrText.setInteractive({ useHandCursor: true });

          // Hover effect (optional, for better UX)
          [startText, settingsText, instrText].forEach((item) => {
            item.on("pointerover", () => item.setStyle({ fill: "#ffff00" }));
            item.on("pointerout", () => {
              // revert color
              if (item === startText) item.setStyle({ fill: "#00ff00" });
              else item.setStyle({ fill: "#ffffff" });
            });
          });

          // Click -> go to other scenes
          startText.on("pointerdown", () => {
            this.scene.start("GameScene");
          });
          settingsText.on("pointerdown", () => {
            this.scene.start("SettingsScene");
          });
          instrText.on("pointerdown", () => {
            this.scene.start("InstructionsScene");
          });
        }
      }

      // GameScene: Example gameplay area. Currently minimal placeholder:
      // In a real project, you’d implement your platforming mechanics here.
      class GameScene extends Phaser.Scene {
        constructor() {
          super({ key: "GameScene" });
        }
        create() {
          // Basic background color for the "gameplay" area
          this.cameras.main.setBackgroundColor("#87CEEB");

          // In a real game:
          //   - Add your player sprite or shape
          //   - Add platforms or tilemaps
          //   - Enable collisions & movement
          // This scaffold has no actual movement or physics to keep it mechanic-free.

          // UI text
          this.add.text(20, 20, "Gameplay Placeholder", {
            font: "18px Arial",
            fill: "#000000",
          });

          // Example: Press 'P' to open PauseScene (a minimal demo)
          this.pauseKey = this.input.keyboard.addKey("P");
        }
        update() {
          if (Phaser.Input.Keyboard.JustDown(this.pauseKey)) {
            this.scene.launch("PauseScene");
            this.scene.pause();
          }
        }
      }

      // PauseScene: Simple overlay for pausing the game.
      // In real usage, you could add more menu options or submenus.
      class PauseScene extends Phaser.Scene {
        constructor() {
          super({ key: "PauseScene" });
        }
        create() {
          // Dark overlay
          this.cameras.main.setBackgroundColor("rgba(0, 0, 0, 0.5)");

          this.add
            .text(400, 200, "Game Paused", {
              font: "30px Arial",
              fill: "#ffffff",
            })
            .setOrigin(0.5);

          const resumeText = this.add
            .text(400, 300, "Resume", {
              font: "20px Arial",
              fill: "#00ff00",
            })
            .setOrigin(0.5);

          const menuText = this.add
            .text(400, 350, "Main Menu", {
              font: "20px Arial",
              fill: "#ffffff",
            })
            .setOrigin(0.5);

          resumeText.setInteractive({ useHandCursor: true });
          menuText.setInteractive({ useHandCursor: true });

          resumeText.on("pointerdown", () => {
            this.scene.stop("PauseScene");
            this.scene.resume("GameScene");
          });
          menuText.on("pointerdown", () => {
            this.scene.stop("GameScene");
            this.scene.start("MenuScene");
          });

          // Hover effect
          [resumeText, menuText].forEach((item) => {
            item.on("pointerover", () => item.setStyle({ fill: "#ffff00" }));
            item.on("pointerout", () => {
              if (item === resumeText) item.setStyle({ fill: "#00ff00" });
              else item.setStyle({ fill: "#ffffff" });
            });
          });
        }
      }

      // SettingsScene: placeholder. In a real project, you’d adjust audio, controls, etc.
      class SettingsScene extends Phaser.Scene {
        constructor() {
          super({ key: "SettingsScene" });
        }
        create() {
          this.cameras.main.setBackgroundColor("#333333");

          this.add
            .text(400, 100, "Settings", {
              font: "28px Arial",
              fill: "#ffffff",
            })
            .setOrigin(0.5);

          // Example text showing a placeholder for potential volume or control settings.
          this.add
            .text(400, 200, "No real settings implemented", {
              font: "20px Arial",
              fill: "#aaaaaa",
            })
            .setOrigin(0.5);

          const backText = this.add
            .text(400, 400, "Back to Menu", {
              font: "20px Arial",
              fill: "#00ff00",
            })
            .setOrigin(0.5);

          backText.setInteractive({ useHandCursor: true });
          backText.on("pointerdown", () => {
            this.scene.start("MenuScene");
          });

          // Hover effect
          backText.on("pointerover", () =>
            backText.setStyle({ fill: "#ffff00" })
          );
          backText.on("pointerout", () =>
            backText.setStyle({ fill: "#00ff00" })
          );
        }
      }

      // InstructionsScene: lists controls or how to play.
      class InstructionsScene extends Phaser.Scene {
        constructor() {
          super({ key: "InstructionsScene" });
        }
        create() {
          this.cameras.main.setBackgroundColor("#222222");

          this.add
            .text(400, 100, "How to Play (Placeholder)", {
              font: "28px Arial",
              fill: "#ffffff",
            })
            .setOrigin(0.5);

          // You’d typically explain your controls or gameplay loop here.
          this.add
            .text(400, 180, "No real mechanics implemented here", {
              font: "20px Arial",
              fill: "#ffffff",
            })
            .setOrigin(0.5);

          const backText = this.add
            .text(400, 500, "Back to Menu", {
              font: "20px Arial",
              fill: "#00ff00",
            })
            .setOrigin(0.5);

          backText.setInteractive({ useHandCursor: true });
          backText.on("pointerdown", () => {
            this.scene.start("MenuScene");
          });

          // Hover effect
          backText.on("pointerover", () =>
            backText.setStyle({ fill: "#ffff00" })
          );
          backText.on("pointerout", () =>
            backText.setStyle({ fill: "#00ff00" })
          );
        }
      }

      // Game configuration and creation
      const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        parent: "game",
        backgroundColor: "#000000",
        // Minimal Arcade physics config (no real usage without mechanics)
        physics: {
          default: "arcade",
          arcade: { debug: false },
        },
        scene: [
          BootScene,
          MenuScene,
          GameScene,
          PauseScene,
          SettingsScene,
          InstructionsScene,
        ],
      };

      // Initialize the game.
      // In a real project, you’d store 'game' in a main.js or similar entry point.
      const game = new Phaser.Game(config);
    </script>
  </body>
</html>
