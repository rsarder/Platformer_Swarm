_crew_common: &crew_common
  cache: false
  max_iter: 100
  memory: false


html5_crew:
  <<: *crew_common
  agents:
    - html5_game_architect
    - mechanics_agent
    - presentation_agent
    - audio_agent
    - ui_hud_agent
    - input_control_agent
    - ai_agent
    - physics_simulation_agent
    - world_design_agent
    - progression_agent
  tasks:
    - html5_game_coding


