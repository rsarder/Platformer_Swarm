_task_common: &task_common
  human_input: false
  async_execution: false


html5_game_task_file_generator:
  <<: *task_common
  agent: html5_game_task_planner
  description: |
    You are tasked with reading the "game_hierarchy.xml" file and generating a separate implementation plan file for each core component of the game.

    Each output file must contain **verbatim content** from the XML hierarchy. You must **not summarize, rephrase, or omit any portion** of the original XML content. Only include the full and exact relevant sections.

    **Setup:**
    - Use the `read_file` tool to load the full contents of `game_hierarchy.xml`.

    **Core Task:**
    - For each of the following game components:
      1. Game Initialization (`game.js`)
      2. Boot Scene (`scenes-boot.js`)
      3. Menu Scene (`scenes-menu.js`)
      4. Game Scene (`scenes-game.js`)
      5. Pause Scene (`scenes-pause.js`)
      6. Settings Scene (`scenes-settings.js`)
      7. Instructions Scene (`scenes-instructions.js`)
      8. Game Systems (`systems.js`)
      9. Game Mechanics (`mechanics.js`)
      10. Player Entity (`entities-player.js`)
      11. Enemy Entity (`entities-enemy.js`)
      12. Level Config (`level-config.json`)
      13. Final Scaffold (`index.html`, `styles.css`)

    - Do the following:
      - Identify the **specific XML nodes** in `game_hierarchy.xml` that correspond to each component.
      - Copy the entire XML content of the relevant `<Mechanic>`, `<SubSystem>`, or `<SubComponent>` elements as-is.
      - Do not alter the formatting, content, or structure of the XML.
      - For each component, create a corresponding markdown file named `task-[component].md` (e.g., `task-game-scene.md`).

    - If multiple XML elements are relevant to a single component, include all of them, each separated by a header that reflects the XML tag’s `<Name>` field.

    - Do not deduplicate or try to avoid redundancy. If a mechanic or system is referenced by multiple modules, include the full original version in each relevant task file.

    **Final Step:**
    - Use the `write_file` tool to save the following files:

      - `task-game-init.md`
      - `task-boot-scene.md`
      - `task-menu-scene.md`
      - `task-game-scene.md`
      - `task-pause-scene.md`
      - `task-settings-scene.md`
      - `task-instructions-scene.md`
      - `task-game-systems.md`
      - `task-game-mechanics.md`
      - `task-player-entity.md`
      - `task-enemy-entity.md`
      - `task-level-config.md`
      - `task-html-scaffold.md`

  expected_output: >
    All task files have been created. Each file contains exact excerpts from game_hierarchy.xml with no alterations, summarizations, or omissions.
    
