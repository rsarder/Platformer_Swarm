html5_game_main_logic:  #Doesn't appear to do anytthing at the moment
  <<: *task_common
  agent: html5_game_engineer
  description: |
    Read task-game-init.md, to understand all neccessary elements for `game.js`.
    Implement the entry point logic for the game in `game.js`, including asset loading, game configuration, and system boot-up.

    **Core Task:**
    - Define and implement the `initGame()` function.
    - Call and coordinate all scenes and systems from this file.
    - Set up Phaser or custom game engine config.

    **Dependencies:**
    - Calls boot scene, handles global setup.

    **Final Step:**
    - Save the implemented `game.js` file.
  expected_output: >
    The game.js file has been implemented, including initGame and global setup logic.

html5_boot_scene_logic:
  <<: *task_common
  agent: html5_game_engineer
  description: |
    Read task-boot-scene.md, to understand all neccessary elements for `scenes-boot.js`.
    Implement the Boot Scene in `scenes-boot.js`, which loads assets and transitions to the Menu Scene.

    **Core Task:**
    - Implement asset loading logic (sprites, audio, etc.).
    - Preload and transition to `scenes-menu.js`.
    - Handle loading screen (can be minimal).

